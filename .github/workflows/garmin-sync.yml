name: Garmin sync

on:
  schedule:
    - cron: "17 4 * * *" # every day 04:17 UTC (06:17 Swedish summer time)
    # Keeps a run at 06:17 Swedish time in winter too (GitHub cron is UTC only),
    # so last night's data is in before the morning check just before 07:00.
    - cron: "17 5 * * *" # 05:17 UTC (06:17 Swedish winter time)
    # Evening runs so the day's sessions are in before the evening check just
    # before 21:00 Swedish time: 20:17 local in summer and in winter time.
    - cron: "17 18 * * *" # 18:17 UTC (20:17 Swedish summer time)
    - cron: "17 19 * * *" # 19:17 UTC (20:17 Swedish winter time)
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = last 3 days, backfill = full activity history, health = full sleep/HRV history"
        type: choice
        options: [daily, backfill, health]
        default: daily

permissions:
  contents: read

concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BRIDGE_URL: https://garmin-bridge-og07.onrender.com
    steps:
      - uses: actions/checkout@v4

      # Render Free sleeps when idle. Waking it only hits the public "/" route,
      # which never contacts Garmin, so retrying here is safe.
      - name: Wake up bridge
        run: curl -fsS --retry 6 --retry-delay 20 --retry-all-errors --max-time 120 "$BRIDGE_URL/" > /dev/null

      - name: Sync activities
        env:
          BRIDGE_API_KEY: ${{ secrets.BRIDGE_API_KEY }}
          MODE: ${{ inputs.mode || 'daily' }}
        run: python3 scripts/run_sync.py "$MODE"
